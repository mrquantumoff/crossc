extend = "target/rust-driver-makefile.toml"

[config]
# The crate is its own single-package Cargo workspace but has a path
# dependency outside it (crates/crossc-ioctl); without this cargo-make treats
# it as a multi-member workspace and runs the WDK tasks in the wrong crate.
default_to_workspace = false
load_script = '''
#!@rust
//! ```cargo
//! [dependencies]
//! wdk-build = "0.6.0"
//! ```
#![allow(unused_doc_comments)]

wdk_build::cargo_make::load_rust_driver_makefile()?
'''
