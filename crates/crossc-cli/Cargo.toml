[package]
name = "crossc-cli"
version = "0.1.1"
edition = "2024"
description = "User-mode probe/experiment tool for the crossc-bth L2CAP pipe driver"
publish = false

[[bin]]
name = "crossc-cli"
path = "src/main.rs"

[dependencies]
avdtp = { path = "../avdtp" }
crossc-core = { path = "../crossc-core" }
crossc-ioctl = { path = "../crossc-ioctl" }
ssc-enc = { path = "../ssc-enc" }

[dev-dependencies]
crossc-core = { path = "../crossc-core", features = ["testing"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_System_Console",
]
