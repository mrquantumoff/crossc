[package]
name = "crossc-tray"
version = "1.0.0"
edition = "2024"
description = "Notification-area icon and flyout that show what crossc-service is streaming to the Galaxy Buds"
publish = false

[[bin]]
name = "crossc-tray"
path = "src/main.rs"

[dependencies]
crossc-status = { path = "../crossc-status" }

# The flyout window. Same pinned version as crossc-installer.
[target.'cfg(windows)'.dependencies]
gpui = "=0.2.2"
# Snapshots from the pipe thread to the flyout's UI task, without polling. Already in the dependency graph through gpui.
async-channel = "2"
# The flyout's HWND, to place it next to the notification area. Already in the dependency graph through gpui.
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies.windows]
version = "=0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
