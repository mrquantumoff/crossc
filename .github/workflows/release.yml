name: Release

# Pushing a tag vX.Y.Z (or vX.Y.Z-suffix) builds the bundle from that tag and publishes a GitHub release.
#
# Running it by hand is a dry run unless told otherwise: it builds, uploads the workflow artifacts and shows the
# release text in the run summary, but publishes nothing. A manual run publishes only with dry_run switched off
# AND when it was started from the tag itself (so the binaries are built from the tagged commit):
#
#   gh workflow run release.yml --ref v0.2.0 -f tag=v0.2.0 -f dry_run=false
#
# The workflow never creates a tag.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.2.0 or v0.2.0-rc.1
        required: true
        type: string
      dry_run:
        description: "Dry run: build and upload workflow artifacts, publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Same compiler as ci.yml, so the release is built by what the tests ran on (and reuses that cache).
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  build:
    name: build ${{ inputs.tag || github.ref_name }}
    runs-on: windows-2025
    timeout-minutes: 90
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      publish: ${{ steps.meta.outputs.publish }}
      artifact-name: ${{ steps.build.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Work out what to release
        id: meta
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          Set-StrictMode -Version Latest

          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $tag = $env:GITHUB_REF_NAME
            $dryRun = $false
          } else {
            $tag = "$($env:INPUT_TAG)".Trim()
            $dryRun = ($env:INPUT_DRY_RUN -ne 'false')
          }

          # Case-sensitive, like git refs: "V1.2.3" is a different tag from "v1.2.3" and not a release tag.
          if ($tag -cnotmatch '^v(?<major>\d+)\.\d+\.\d+(?<suffix>-[0-9A-Za-z.-]+)?$') {
            throw "'$tag' is not a release tag. Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-suffix."
          }
          $version = $tag.Substring(1)
          $hasSuffix = [bool]$Matches['suffix']
          # Prerelease: any -suffix, and everything before 1.0.0.
          $prerelease = $hasSuffix -or ([int]$Matches['major'] -eq 0)

          # Only a run on the tag ref publishes, so the release can never carry binaries of some other commit.
          $onTag = ($env:GITHUB_REF -ceq "refs/tags/$tag")
          if (-not $dryRun -and -not $onTag) {
            throw ("dry_run is off, but this run is on $($env:GITHUB_REF), not on refs/tags/$tag. " +
              "Start it from the tag: gh workflow run release.yml --ref $tag -f tag=$tag -f dry_run=false")
          }
          $publish = (-not $dryRun) -and $onTag

          # The programs report the version of their crate, not the tag: say so when the two differ.
          $manifest = Get-Content crates/crossc-installer/Cargo.toml -Raw
          if ($manifest -match '(?m)^version\s*=\s*"([^"]+)"') {
            $crateVersion = $Matches[1]
            if ($crateVersion -ne $version) {
              Write-Host "::warning title=Version mismatch::The tag says $version but crates/crossc-installer/Cargo.toml says $crateVersion."
            }
          }

          $bool = @{ $true = 'true'; $false = 'false' }
          @(
            "tag=$tag"
            "version=$version"
            "prerelease=$($bool[$prerelease])"
            "publish=$($bool[$publish])"
          ) | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8

          if ($publish) { $mode = 'publish a GitHub release' } else { $mode = 'DRY RUN, nothing is published' }
          @(
            "## crossc $version"
            ''
            "| | |"
            "|---|---|"
            "| Tag | ``$tag`` |"
            "| Commit | ``$($env:GITHUB_SHA)`` |"
            "| Prerelease | $($bool[$prerelease]) |"
            "| Mode | $mode |"
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Build and package
        id: build
        uses: ./.github/actions/build
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          version: ${{ steps.meta.outputs.version }}
          upload: "true"
          # Only a hand-over to the jobs below; the release assets are the copy that is kept.
          retention-days: "1"

  # Everything a release needs except the permission to publish: runs in dry runs too.
  notes:
    name: release text + checksum check
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ needs.build.outputs.tag }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/release
            docs/release-notes

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist

      - name: Verify the checksums
        working-directory: dist
        run: |
          ls -l
          test -f "crossc-${VERSION}-x64.zip"
          test -f "crossc-${VERSION}-symbols.zip"
          sha256sum -c SHA256SUMS.txt

      # docs/release-notes/<tag>.md if it exists, otherwise GitHub's generated notes (added at publish time);
      # in both cases followed or preceded by the test-signing statement.
      - name: Compose the release text
        run: |
          mkdir -p release-text
          notes="docs/release-notes/${TAG}.md"
          if [ -f "$notes" ]; then
            echo "Using $notes"
            cat "$notes" > release-text/body.md
            printf '\n\n' >> release-text/body.md
            echo false > release-text/generate-notes
          else
            echo "No $notes: GitHub generates the notes"
            : > release-text/body.md
            echo true > release-text/generate-notes
          fi
          sed "s/@@VERSION@@/${VERSION}/g" .github/release/RELEASE-BODY.md >> release-text/body.md

          {
            echo "## Release text for ${TAG}"
            echo
            if [ "$(cat release-text/generate-notes)" = true ]; then
              echo "_No \`${notes}\`: GitHub's generated notes are appended to this when the release is published._"
              echo
            fi
            cat release-text/body.md
            echo
            echo "## Checksums"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-text
          path: release-text/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish GitHub release
    needs: [build, notes]
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.build.outputs.tag }}
      VERSION: ${{ needs.build.outputs.version }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-text
          path: release-text

      - name: Create the release
        run: |
          args=(--verify-tag --title "crossc ${VERSION}" --notes-file release-text/body.md)
          if [ "$(cat release-text/generate-notes)" = true ]; then args+=(--generate-notes); fi
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "$TAG" "${args[@]}" \
            "dist/crossc-${VERSION}-x64.zip" \
            "dist/crossc-${VERSION}-symbols.zip" \
            dist/SHA256SUMS.txt
          gh release view "$TAG" --json url,isPrerelease,assets \
            --jq '"Published \(.url) (prerelease: \(.isPrerelease)), assets: \([.assets[].name] | join(", "))"' \
            | tee -a "$GITHUB_STEP_SUMMARY"
