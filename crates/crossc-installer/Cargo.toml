[package]
name = "crossc-installer"
version = "0.2.0"
edition = "2024"
description = "GPUI desktop tool that installs and uninstalls the crossc_bth driver and the crossc service for Galaxy Buds (and builds them in the repo)"
publish = false

[[bin]]
name = "crossc-installer"
path = "src/main.rs"

[dependencies]
gpui = "=0.2.2"
# Release list from the GitHub API. Already in the dependency graph through gpui.
serde_json = "1"
# Unpacks the downloaded release zip: stored and deflate entries only, no other compression, no encryption.
zip = { version = "7.3", default-features = false, features = ["deflate-flate2"] }
# The inflate backend for `zip` (pure Rust, miniz_oxide). Already in the dependency graph through gpui.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[target.'cfg(windows)'.dependencies.windows]
version = "=0.62.2"
features = [
    "Wdk_System_SystemInformation",
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
