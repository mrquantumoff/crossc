[package]
name = "crossc-status"
version = "1.0.0"
edition = "2024"
description = "Status protocol between crossc-service and its user interfaces: the snapshot, its wire format and the named pipe that carries it"
publish = false

[dependencies]
# Both are in the dependency graph already (crossc-installer, gpui); the versions are the ones Cargo.lock holds.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "=0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
]
