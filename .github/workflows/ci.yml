name: CI

on:
  push:
    branches: [master, ci]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always
  # A fixed release rather than "stable": clippy runs with -D warnings, and a new compiler must not turn an
  # unrelated push red. Keep in step with release.yml when raising it.
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  test:
    name: fmt, clippy, test
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      # Line numbers in backtraces are enough here; full debug info only makes the gpui build and its cache bigger.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

  package:
    name: driver + bundle
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and package
        uses: ./.github/actions/build
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
